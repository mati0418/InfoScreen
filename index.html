<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Infoscreen</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
</head>

<body class="bg-slate-900 text-white font-sans h-screen ">
    <div class="p-16 grid grid-cols-2 gap-8 w-full">

        <!-- Aktuelles Wetter -->
        <div id="current"></div>
        <div id="current-time" class="text-6xl opacity-70 mt-2 self-center text-end"></div>

        <!-- Forecast -->
        <div id="forecast" class="flex gap-6 mt-10 col-span-full"></div>

    </div>

    <script>
        function formatDate(dateStr) {
            const days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
            const d = new Date(dateStr);
            return days[d.getDay()];
        }

        function getWeatherIcon(code, time = "1200", sunrise = "600", sunset = "1800") {
            const isNightTime = Number(time) < Number(sunrise) || Number(time) > Number(sunset);

            const dayNight = isNightTime ? "night" : "day";

            const map = {
                113: isNightTime ? "wi-night-clear" : "wi-day-sunny",
                116: `wi-${dayNight}-cloudy`,
                119: "wi-cloudy",
                122: "wi-cloudy",
                143: "wi-fog",
                176: `wi-${dayNight}-showers`,
                179: `wi-${dayNight}-sleet`,
                182: `wi-${dayNight}-sleet`,
                185: `wi-${dayNight}-sleet`,
                200: `wi-${dayNight}-lightning`,
                227: `wi-${dayNight}-snow`,
                230: "wi-snow",
                248: "wi-fog",
                260: "wi-fog",
                263: `wi-${dayNight}-showers`,
                266: `wi-${dayNight}-rain`,
                281: `wi-${dayNight}-sleet`,
                284: `wi-${dayNight}-sleet`,
                293: `wi-${dayNight}-rain`,
                296: `wi-${dayNight}-rain`,
                299: `wi-${dayNight}-storm-showers`,
                302: `wi-${dayNight}-rain-wind`,
                305: `wi-${dayNight}-storm-showers`,
                308: `wi-${dayNight}-rain-wind`,
                311: `wi-${dayNight}-sleet`,
                314: `wi-${dayNight}-sleet`,
                317: `wi-${dayNight}-sleet`,
                320: `wi-${dayNight}-snow`,
                323: `wi-${dayNight}-snow`,
                326: `wi-${dayNight}-snow`,
                329: "wi-snow",
                332: "wi-snow",
                335: `wi-${dayNight}-snow`,
                338: "wi-snow",
                350: `wi-${dayNight}-sleet`,
                353: `wi-${dayNight}-showers`,
                356: `wi-${dayNight}-storm-showers`,
                359: `wi-${dayNight}-rain-wind`,
                362: `wi-${dayNight}-sleet`,
                365: `wi-${dayNight}-sleet`,
                368: `wi-${dayNight}-snow`,
                371: `wi-${dayNight}-snow`,
                374: `wi-${dayNight}-sleet`,
                377: `wi-${dayNight}-sleet`,
                386: `wi-${dayNight}-lightning`,
                389: `wi-${dayNight}-lightning`,
                392: `wi-${dayNight}-lightning`,
                395: `wi-${dayNight}-snow`,

                // Default
                default: "wi-cloud"
            };

            return map[code] || map.default;
        }

        function getIconColor(code) {
            if (typeof code === "string") code = parseInt(code);
            if ([113].includes(code)) return "text-yellow-400"; // Sonne
            if ([116].includes(code)) return "text-gray-300"; // partly
            if ([119,122].includes(code)) return "text-gray-400"; // cloudy
            if ([143,248,260].includes(code)) return "text-gray-500"; // fog
            if ([176,179,182,185,227,263,266,281,284,293,296,311,314,317,320,323,326,350,353,362,365,368,374,377,299,302,305,308,356,359].includes(code)) return "text-blue-400"; // rain
            if ([230,329,332,335,338,371,395].includes(code)) return "text-white"; // snow
            if ([200,386,389,392].includes(code)) return "text-orange-400"; // thunder

            return "text-gray-300";
        }

        async function loadWeather() {
            const res = await fetch('/weather');
            const data = await res.json();

            // Aktuelles Wetter
            document.getElementById('current').innerHTML = `
                <div class="flex w-full items-center gap-6 mb-6">
		            <div class="text-6xl w-fit text-center">Aktuelles Wetter:</div>
                    <i class="wi ${getWeatherIcon(data.current.code,
                        (() => {
                            const jetzt = new Date();
                            return `${jetzt.getHours()}${jetzt.getMinutes()}`;
                        })(),
                        data.forecast[0].sunrise,
                        data.forecast[0].sunset)} text-8xl ${getIconColor(data.current.code)}"></i>
                    <div class="text-6xl">
			${data.current.temp}°C
                    </div>
                </div>
                <div class="text-4xl opacity-80">
                    ${data.current.desc}
                </div>
            `;
            // Forecast
            let forecastHtml = "";
            data.forecast.forEach(day => {
                let hourlyHtml = "";
                day.hourly.forEach(hour => {
                    hourlyHtml += `
                        <div class="flex gap-8 bg-slate-700 p-4 rounded-lg w-full items-center shadow">
                            <div class="font-bold text-2xl mb-1 w-1/6 text-right">
                                ${hour.time.slice(0, -2)}:00
                            </div>
                            <i class="wi ${getWeatherIcon(hour.code, hour.time, day.sunrise, day.sunset)} text-4xl ${getIconColor(hour.code)} w-1/6"></i>
                            <div class="text-2xl mt-1 opacity-80 w-3/6">
                                ${hour.desc}
                            </div>
                            <div class="text-2xl text-center mt-1 w-1/6">
                                ${hour.temp}°
                            </div>
                        </div>
                    `;
                });
                forecastHtml += `
                    <div class="bg-slate-800 grid grid-cols-2 p-6 rounded-2xl w-1/3 content-start shadow-lg">
                        <div class="font-bold mb-2 text-4xl col-span-2 h-12">
                            ${formatDate(day.date)}
                        </div>
                        <i class="wi ${getWeatherIcon(day.code)} text-8xl h-32 row-span-2 ${getIconColor(day.code)}"></i>
                        <div class="text-2xl opacity-80 h-16">
                            ${day.desc}
                        </div>
                        <div class="text-2xl h-16">
                            ${day.max}° / ${day.min}°
                        </div>
                        <div class="flex-col gap-4 justify-center col-span-full">
                            ${hourlyHtml}
                        </div>
                    </div>
                `;
            });

            document.getElementById('forecast').innerHTML = forecastHtml;
     
        }
	    function updateTime() {
    		const now = new Date();
		    const hours = now.getHours().toString().padStart(2,"0");
		    const minutes = now.getMinutes().toString().padStart(2,"0");
		    document.getElementById('current-time').innerHTML = `${hours}:${minutes}`;
	    }

        loadWeather();
        setInterval(loadWeather, 300000); // alle 5 Minuten
        updateTime();
        setInterval(updateTime, 60000);  // jede Minute

	    //setInterval(() => {location.reload();}, 20000);
    </script>
</body>
</html>
