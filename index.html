<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Infoscreen</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
</head>

<body class="bg-slate-900 text-white font-sans h-screen overflow-hidden">
    <div class="p-10">

        <!-- Aktuelles Wetter -->
        <div id="current"></div>

        <!-- Forecast -->
        <div id="forecast" class="flex gap-6 mt-10"></div>

    </div>

    <script>
        function formatDate(dateStr) {
            const days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
            const d = new Date(dateStr);
            return days[d.getDay()];
        }

        function isNight() {
            const hour = new Date().getHours();
            return hour < 6 || hour > 20;
        }

        function getWeatherIcon(code) {
            const isNightTime = isNight();

            const dayNight = isNightTime ? "night" : "day";

            const map = {
                // Klar / Sonne
                113: `wi-${dayNight}-sunny`,

                // Teilweise bewölkt
                116: `wi-${dayNight}-cloudy`,

                // Bewölkt
                119: "wi-cloudy",
                122: "wi-cloudy",

                // Nebel / Dunst
                143: "wi-fog",
                248: "wi-fog",
                260: "wi-fog",

                // leichter Regen
                176: "wi-showers",
                263: "wi-showers",
                266: "wi-showers",

                // Regen
                293: "wi-rain",
                296: "wi-rain",
                299: "wi-rain",
                302: "wi-rain",
                305: "wi-rain",
                308: "wi-rain",

                // Schnee
                323: "wi-snow",
                326: "wi-snow",
                329: "wi-snow",
                332: "wi-snow",
                335: "wi-snow",
                338: "wi-snow",

                // Schneeregen
                179: "wi-sleet",
                362: "wi-sleet",
                365: "wi-sleet",

                // Gewitter
                200: "wi-thunderstorm",
                386: "wi-thunderstorm",
                389: "wi-thunderstorm",

                // Default
                default: "wi-cloud"
            };

            return map[code] || map.default;
        }

        function getIconColor(code) {
            if (code === 113) return "text-yellow-400"; // Sonne
            if ([116].includes(code)) return "text-gray-300"; // partly
            if ([119,122].includes(code)) return "text-gray-400"; // cloudy
            if ([143,248,260].includes(code)) return "text-gray-500"; // fog
            if (code >= 176 && code <= 308) return "text-blue-400"; // rain
            if (code >= 323 && code <= 338) return "text-white"; // snow
            if ([200,386,389].includes(code)) return "text-purple-400"; // thunder

            return "text-gray-300";
        }

        async function loadWeather() {
            const res = await fetch('/weather');
            const data = await res.json();

            // Aktuelles Wetter
            document.getElementById('current').innerHTML = `
                <div class="flex items-center gap-6 mb-6">
                    <i class="wi ${getWeatherIcon(data.current.code)} text-6xl ${getIconColor(data.current.code)}"></i>
                    <div class="text-6xl">
                        ${data.current.temp}°C
                    </div>
                </div>
                <div class="text-2xl opacity-80">
                    ${data.current.desc}
                </div>
            `;
            // Forecast
            let forecastHtml = "";
            data.forecast.forEach(day => {
                let hourlyHtml = "";
                day.hourly.forEach(hour => {
                    hourlyHtml += `
                        <div class="flex gap-8 bg-slate-700 p-4 rounded-lg w-full items-center shadow">
                            <div class="font-bold mb-1 w-1/6 text-right">
                                ${hour.time.slice(0, -2)}:00
                            </div>
                            <i class="wi ${getWeatherIcon(hour.code)} text-2xl ${getIconColor(hour.code)} w-1/6"></i>
                            <div class="text-sm mt-1 opacity-80 w-3/6">
                                ${hour.desc}
                            </div>
                            <div class="text-lg text-center mt-1 w-1/6">
                                ${hour.temp}°
                            </div>
                        </div>
                    `;
                });
                forecastHtml += `
                    <div class="bg-slate-800 p-6 rounded-2xl w-1/3 text-center shadow-lg">
                        <div class="font-bold mb-2 text-lg">
                            ${formatDate(day.date)}
                        </div>
                        <i class="wi ${getWeatherIcon(day.code)} text-3xl ${getIconColor(day.code)}"></i>
                        <div class="text-sm mt-1 opacity-80">
                            ${day.desc}
                        </div>
                        <div class="text-lg mt-2">
                            ${day.max}° / ${day.min}°
                        </div>
                        <div class="flex-col gap-4 mt-4 justify-center">
                            ${hourlyHtml}
                        </div>
                    </div>
                `;
            });

            document.getElementById('forecast').innerHTML = forecastHtml;
            feather.replace();
        }

        loadWeather();
        setInterval(loadWeather, 300000); // alle 5 Minuten
    </script>
</body>
</html>
